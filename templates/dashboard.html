<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Management Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        input, select { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #333; background: #2b2b2b; color: white; }
        button { padding: 10px 15px; background: #28a745; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-del { background: #dc3545; padding: 5px 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #2b2b2b; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        a.logout { color: #ff5555; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header card">
            <h2>User Management Panel</h2>
            <a href="/admin/logout" class="logout">Logout</a>
        </div>

        <div class="card">
            <h3>Add New User</h3>
            <form action="/admin/create_user" method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="text" name="password" placeholder="Password" required>
                <input type="number" name="days" placeholder="Validity (Days)" value="30" min="1" required>
                <button type="submit">Create User</button>
            </form>
        </div>

        <div class="card">
            <h3>Registered Users</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Password</th>
                        <th>Expires At</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{ user.id }}</td>
                        <td><strong>{{ user.username }}</strong></td>
                        <td>{{ user.password }}</td>
                        <td>{{ user.expires_at }}</td>
                        <td>
                            <form action="/admin/delete_user/{{ user.id }}" method="POST" style="display:inline;">
                                <button type="submit" class="btn-del" onclick="return confirm('Delete this user?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="5" style="text-align: center;">No users created yet.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
